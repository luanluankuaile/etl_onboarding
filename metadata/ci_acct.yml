source:
  system: SharePoint
  path: /Documents/share/temp/bamboo_ai/source/*.csv
  connection_secret: SHAREPOINT_CI_ACCT_CONNECTION
  load_mode: incremental
landing:
  table: land_cust_ci_acct
  pattern: "*.csv"
  processor: ci_acct
  immutable: true
  checksum: sha256
raw:
  table: raw_cust_ci_acct
  quarantine_table: raw_cust_ci_acct__quarantine
  preserve_string_columns: [acct_id, version]
persistent:
  - name: ci_acct
    source_table: raw_cust_ci_acct
    target_table: per_cust_ci_acct
    keys: [acct_id]
    deduplicate_by: [acct_id]
    columns:
      - {name: acct_id, type: TEXT, nullable: false}
      - {name: bill_cyc_cd, type: TEXT}
      - {name: setup_dt, type: TEXT}
      - {name: currency_cd, type: TEXT}
      - {name: acct_mgmt_grp, type: TEXT}
      - {name: bill_after_dt, type: TEXT}
      - {name: protect_cyc_sw, type: TEXT}
      - {name: cis_division, type: TEXT}
      - {name: mailing_prem_id, type: TEXT}
      - {name: protect_prem_sw, type: TEXT}
      - {name: coll_cl_cd, type: TEXT}
      - {name: cr_review_dt, type: TEXT}
      - {name: postpone_cr_rvw_dt, type: TEXT}
      - {name: int_cr_review_sw, type: TEXT}
      - {name: cust_cl_cd, type: TEXT}
      - {name: bill_prt_intercept, type: TEXT}
      - {name: no_dep_rvw_sw, type: TEXT}
      - {name: version, type: TEXT, nullable: false}
consumption:
  - name: ci_acct_current
    refresh: sql
    sql: |
      CREATE TABLE IF NOT EXISTS ci_acct_current AS
      SELECT * FROM source.per_cust_ci_acct;
columns:
  date_format: M/d/yyyy
  version: TEXT
quality:
  required: [acct_id, version]
  quarantine_invalid: true
  preserve_leading_zeroes: [acct_id]
lineage:
  source_table: ci_acct
  landing_table: land_cust_ci_acct
  raw_table: raw_cust_ci_acct
  persistent_table: per_cust_ci_acct
