name: customer_daily
data_domain: customer
schedule: daily
data_processors:
  - processor_name: customer_customers_land_to_raw
    notebook: etl_framework.notebook_processors.landing_to_raw
    source_tables: []
    target_tables: [raw.customers]
    parameters:
      fail_on_no_new_data: false
  - processor_name: customer_customers_raw_to_per
    notebook: etl_framework.notebook_processors.raw_to_persistent
    depends_on: [customer_customers_land_to_raw]
    source_tables: [raw.customers]
    target_tables: [persistent.customers]
  - processor_name: customer_customers_per_to_consumption
    notebook: etl_framework.notebook_processors.persistent_to_consumption
    depends_on: [customer_customers_raw_to_per]
    source_tables: [persistent.customers]
    target_tables: [consumption.customer_emails]